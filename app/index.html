const SQ={};let lastTap=0;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pendingN=()=>Object.values(SQ).filter(x=>x.t||x.busy).length;
function syncNote(){const n=pendingN();let el=$('#sync');if(!el){el=document.createElement('div');el.id='sync';el.style.cssText='position:fixed;top:max(14px,env(safe-area-inset-top));right:56px;z-index:30;font-size:12px;font-weight:700;color:#cbd5e1';document.body.appendChild(el)}const tags=document.querySelectorAll('[data-saved]');el.textContent=n&&!tags.length?'Saving…':'';tags.forEach(t=>{t.textContent=n?'Saving…':(savedAt&&Date.now()-savedAt<8000?'✓ Saved':'');t.classList.toggle('busy',!!n)})}
let savedAt=0;
function queue(k,fn){lastTap=Date.now();const s=SQ[k]||(SQ[k]={});s.fn=fn;clearTimeout(s.t);s.t=setTimeout(()=>flush(k),400);syncNote()}
async function flush(k){const s=SQ[k];if(!s)return;clearTimeout(s.t);s.t=null;if(s.busy){s.again=true;return}s.busy=true;syncNote();
 let err=null;try{err=await s.fn()}catch(e){err=e}s.busy=false;
 if(err){s.failed=true;toast('Couldn\u2019t save: '+((err&&err.message)||'error')+' — refreshing');}
 if(s.again){s.again=false;return flush(k)}
 if(!s.t){const f=s.failed;if(!f)savedAt=Date.now();delete SQ[k];if(f){await sleep(50);if(!pendingN()){await load();render()}}else if(!pendingN()&&V.tab==='person'&&!(document.activeElement&&document.activeElement.type==='date'))render()}syncNote()}
async function drain(){Object.keys(SQ).forEach(k=>{if(SQ[k].t)flush(k)});while(pendingN())await sleep(80)}

 if(j.department&&c.length){const dn=deptName(j.department),srt=a=>[...a.filter(x=>G.r.includes(x)),...a.filter(x=>G.m.includes(x)),...a.filter(x=>G.o.includes(x))],all=[...G.r,...G.m,...G.o],same=srt(all.filter(x=>x[0].department===j.department)),oth=srt(all.filter(x=>x[0].department!==j.department));

 for(const p of D.people){for(const v of pVariants(p)){let sc=0,ok=false;
  if(v.full===s){sc=1;ok=true}
  else if(l&&v.l&&(v.l===l||v.l.startsWith(l+' ')||v.l.split(' ')[0]===l||v.l.replace(/ /g,'').startsWith(l.replace(/ /g,'')))&&nickEq(f,v.f)){sc=.93;ok=v.l===l||v.l.startsWith(l+' ')||v.l.startsWith(l+'-')||v.l.split(/[ -]/)[0]===l}
  else if(l.length===1&&v.f===f&&v.l.startsWith(l))sc=.85;
  else if(l&&v.l&&v.f===f&&sim(l,v.l)>=.8)sc=.86;
  else if(l&&v.l&&v.l===l&&sim(f,v.f)>=.75)sc=.84;
  else{const x=sim(s,v.full);if(x>=.86)sc=x*.95}
  if(sc&&(!best||sc>best.sc))best={p,sc,ok}}}
 if(!best)return{pid:null,st:'none'};

 if(isC){j.newC=n==='new'?j.custRaw:null;j.cust=n==='new'?j.custRaw:n==null?null:L[n].name;j.cst=j.cust?'ok':'blank'}else{j.newT=n==='new'?j.typeRaw:null;j.type=n==='new'?j.typeRaw:n==null?null:L[n].name;j.tst=j.type?'ok':'blank'}closeSheet()}
const jibOf=j=>/\bjib\b/i.test([j.site,j.description,j.work_type,j.notes,...(j.equipment||[])].filter(Boolean).join(' '));const ginCert=()=>D.certs.find(c=>/gin\s*-?\s*poles?/i.test(c.name));
const TOWER_RE=/gin\s*-?\s*pole|capstan|climb|tower|rescue|tuf-?tug/i;const nonTower=j=>['civil','electrical'].includes(nn(j.type||''))||['civil','electrical'].includes(scanDept(j.department));
function scanReq(j){const r=reqFrom(j.type,j.cust),g=!nonTower(j)&&jibOf(j)&&ginCert();if(g&&!r.required.includes(g.id))r.required=[...r.required,g.id];if(nonTower(j)){r.required=r.required.filter(i=>!TOWER_RE.test(cert(i).name));r.one_of=r.one_of.filter(i=>r.required.includes(i))}return r}
function tcLine(j,i){const b=(lab,v,st,raw,k)=>{const fl=st==='check'?' <span class="pill a" style="font-size:11px;padding:1px 8px">Check</span>':'';const txt=v?`<b style="color:var(--ink)">${esc(v)}</b>${(k==='c'?j.newC:j.newT)?' <span class="sub">(new)</span>':''}${fl}`:raw?`<span style="color:#991b1b">“${esc(raw)}” not in Setup</span>`:'<span class="sub">none</span>';return `<span role="button" style="cursor:pointer;text-decoration:underline dotted #94a3b8" onclick="event.stopPropagation();SCAN.tc={i:${i},k:'${k}'};openSheet('tc')">${lab}: ${txt}</span>`};
 const r=scanReq(j).required;return `<div class="sub" style="margin:2px 0 4px;line-height:1.7">${b('Customer',j.cust,j.cst,j.custRaw,'c')} · ${b('Type',j.type,j.tst,j.typeRaw,'t')}${r.length?`<br>Requires: ${esc(r.map(i=>cert(i).name).join(', '))}`:''}</div>`}

/* ---------- backup & restore ---------- */
const BKN='Backups include everything, including which photos belong to each cert. The photo image files stay safely in storage and aren’t inside the backup file.';
const bkCo=()=>V.id||cid;const bkName=id=>(companies.find(c=>c.id===id)||{}).name||'Company';
const bkFile=n=>`CertCompliance-${String(n).replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')||'company'}-${today()}.json`;
const bkCounts=d=>({certs:(d.certs||[]).length,people:(d.people||[]).length,jobs:(d.jobs||[]).length,person_certs:(d.person_certs||[]).length,job_types:(d.job_types||[]).length,customers:(d.customers||[]).length});
const bkSum=c=>`${c.people} people · ${c.certs} certs · ${c.jobs} jobs · ${c.person_certs} person certs · ${c.job_types} types · ${c.customers} customers`;
const bkWhen=t=>new Date(t).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
const BKK={auto:['Auto','b'],manual:['Saved','g'],'pre-restore':['Before restore','y']};
let bkList=null;
async function loadBk(id){bkList=await q(sb.rpc('backup_list',{cid:id}))}
async function openBk(id){V.rs=null;bkList=null;go('backup',{id});await loadBk(id);render()}
async function shareFile(name,obj){const blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});
 try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})&&/iP(hone|ad|od)|Android/.test(navigator.userAgent)){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
async function bkDownload(id){const d=await q(sb.rpc('export_company',{cid:id}));await shareFile(bkFile(d.company.name),d);toast('Backup downloaded')}
async function bkDownloadAll(){const out={app:'CertCompliance',kind:'all-companies',version:1,created_at:new Date().toISOString(),companies:[]};for(const c of companies)out.companies.push(await q(sb.rpc('export_company',{cid:c.id})));await shareFile(`CertCompliance-all-companies-${today()}.json`,out);toast(`Downloaded ${out.companies.length} companies`)}
async function bkSaveNow(id){await q(sb.rpc('save_backup',{cid:id}),'Backup saved');await loadBk(id);render()}
async function bkGet(bid){const [r]=await q(sb.from('company_backups').select('data,created_at,kind').eq('id',bid));return r}
async function bkSaved(bid,dl){const r=await bkGet(bid);if(dl)return shareFile(bkFile(r.data.company&&r.data.company.name||bkName(bkCo())),r.data);V.rs={data:r.data,label:`${(BKK[r.kind]||[r.kind])[0]} backup from ${bkWhen(r.created_at)}`};render(true);setTimeout(()=>{const e=$('#rsCard');e&&e.scrollIntoView({block:'start'})},30)}
async function bkPick(inp){const f=inp.files[0];if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(e){return toast('That file isn\u2019t a backup')}
 if(d&&d.kind==='all-companies')d=(d.companies||[]).find(x=>x.company&&x.company.id===bkCo())||(d.companies||[]).find(x=>x.company&&x.company.name===bkName(bkCo()));
 if(!d||d.app!=='CertCompliance'||!Array.isArray(d.people))return toast('That file isn\u2019t a Cert Compliance backup. For old-app files use Import.');
 V.rs={data:d,label:`File “${f.name}”`+(d.company&&d.company.name!==bkName(bkCo())?` (from ${d.company.name})`:'')};render(true)}
function rsCard(){const r=V.rs,n=bkName(bkCo());if(!r)return'';const c=bkCounts(r.data);
 return `<div class="card" id="rsCard" style="border:2px solid #dc2626"><h2>Restore this backup?</h2><div class="t">${esc(r.label)}</div><div class="sub">Made ${r.data.created_at?bkWhen(r.data.created_at):'unknown date'}</div><p class="sub">${bkSum(c)}</p>
 <div class="note" style="background:#fef2f2;color:#991b1b">This replaces <b>all</b> of ${esc(n)}’s current certs, people, jobs, types and customers with the backup. A “Before restore” backup is saved first so you can undo. Sign-in accounts aren’t changed.</div>
 <label>Type <b>${esc(n)}</b> or <b>RESTORE</b> to confirm<input id="rsConf" autocomplete="off" autocapitalize="off"></label>
 <button class="btn red" id="rsGo" onclick="busy(this,bkRestore)">Restore ${esc(n)}</button><button class="btn sec" style="margin-top:8px" onclick="V.rs=null;render(true)">Cancel</button></div>`}
async function bkRestore(){const id=bkCo(),n=bkName(id),v=($('#rsConf').value||'').trim();if(v!=='RESTORE'&&v.toLowerCase()!==n.toLowerCase())return toast(`Type ${n} or RESTORE to confirm`);
 const b=$('#rsGo');if(b)b.textContent='Restoring…';await q(sb.rpc('restore_company',{cid:id,d:V.rs.data}));V.rs=null;if(cid===id)await load();await loadBk(id);toast('Restored. A “Before restore” backup was saved.');render(true)}
function backupView(){const id=bkCo(),n=bkName(id),fromOwner=owner&&!cid;
 return `<button class="back" onclick="goBack('${fromOwner?'owner':'setup'}')">← ${fromOwner?esc(n):'Setup'}</button><h1>Backup &amp; restore</h1><div class="note">🛟 ${BKN}</div>
 <div class="card"><h2>Download</h2><p class="sub" style="margin-top:0">Save a copy of ${esc(n)} to your phone or computer.</p><button class="btn" onclick="busy(this,()=>bkDownload('${id}'))">⬇️ Download backup</button>
 <button class="btn sec" style="margin-top:8px" onclick="busy(this,()=>bkSaveNow('${id}'))">💾 Save a backup now</button><p class="sub" style="margin-bottom:0">Saved automatically every night. The last 30 are kept.</p></div>
 ${rsCard()}
 <div class="card"><h2>Restore</h2><label class="btn sec" style="cursor:pointer">📄 Restore from backup file<input type="file" accept=".json,application/json,text/plain,*/*" style="display:none" onchange="bkPick(this)"></label>
 <h2 style="margin-top:14px">Saved backups${bkList?` (${bkList.length})`:''}</h2>${bkList==null?'<p class="sub"><span class="spin"></span> Loading…</p>':bkList.map(b=>`<div class="item bk" style="cursor:default"><div class="grow"><div class="t">${bkWhen(b.created_at)} <span class="pill ${(BKK[b.kind]||[])[1]||'b'}">${(BKK[b.kind]||[b.kind])[0]}</span></div><div class="sub">${bkSum(b.counts)}</div></div><button class="add" aria-label="Download" onclick="busy(this,()=>bkSaved('${b.id}',1))">⬇️</button><button class="add" onclick="busy(this,()=>bkSaved('${b.id}'))">Restore</button></div>`).join('')||'<p class="sub">No saved backups yet. Tap “Save a backup now”.</p>'}</div>`}

/* ---------- owner ---------- */
function ownerHome(){cid=null;localStorage.removeItem('cc.app.ownerCid');D=null;go('owner')}
async function openCo(id){cid=id;localStorage.setItem('cc.app.ownerCid',id);await load();go('jobs')}
function coStat(c){if(!c.active)return'<span class="pill r">Access off</span>';if(c.trial_ends&&c.trial_ends>=today())return`<span class="pill b">Trial to ${fmt(c.trial_ends)}</span>`;return'<span class="pill g">Active</span>'}
function ownerView(){const on=companies.filter(c=>c.active).length,mrr=companies.filter(c=>c.active&&!(c.trial_ends&&c.trial_ends>=today())).reduce((s,c)=>s+(+c.price||0),0);
 return `<h1>Companies</h1><div class="row" style="margin-bottom:12px"><div class="card" style="margin:0;padding:12px"><div class="sub">With access</div><div class="big" style="font-size:24px">${on}/${companies.length}</div></div><div class="card" style="margin:0;padding:12px"><div class="sub">Monthly (set prices)</div><div class="big" style="font-size:24px">$${mrr.toFixed(0)}</div></div></div>
 <button class="btn" onclick="go('invco')">＋ Invite a company</button><div class="card" style="padding:4px 14px;margin-top:12px">${companies.map(c=>`<div class="item"><div class="grow" onclick="openCompany('${c.id}')"><div class="t">${esc(c.name)}${c.is_test?' <span class="chip">TEST</span>':''}</div><div class="sub">${c.price?'$'+(+c.price).toFixed(0)+(c.plan==='per_user'?'/user':'')+'/mo · ':''}${coStat(c)}</div></div><input type="checkbox" class="sw" ${c.active?'checked':''} aria-label="Access" onchange="coAccess('${c.id}',this.checked)"></div>`).join('')||'<p class="sub">No companies yet.</p>'}</div>
 <button class="btn sec" onclick="busy(this,bkDownloadAll)">⬇️ Download all companies</button><div class="note">🛟 ${BKN}</div><div class="note">💳 Billing with Stripe comes later. For now, switch access on or off by hand.</div>`}
async function coAccess(id,on){if(!on&&!confirm('Turn off access? Their people won\u2019t be able to sign in. Data is kept.'))return render();await q(sb.from('companies').update({active:on}).eq('id',id),on?'Access on':'Access off — data kept');companies=await q(sb.from('companies').select('*').order('name'));render()}
function companyView(){const c=companies.find(x=>x.id===V.id);if(!c)return ownerView();
 return `<button class="back" onclick="goBack('owner')">← Companies</button><div class="card"><div class="row" style="align-items:center"><h1 class="grow">${esc(c.name)}</h1><span style="flex:none">${coStat(c)}</span></div>
 <div class="item" style="cursor:default"><div class="grow"><div class="t">Access</div><div class="sub">Off = members can't sign in. Data is kept.</div></div><input type="checkbox" class="sw" ${c.active?'checked':''} onchange="coAccess('${c.id}',this.checked)"></div>
 <label style="margin-top:10px">Company name<input id="cn" value="${esc(c.name)}"></label><div class="row"><label>Pricing<select id="cpl"><option value="per_company" ${c.plan==='per_company'?'selected':''}>Per company</option><option value="per_user" ${c.plan==='per_user'?'selected':''}>Per user</option></select></label><label>Price $/mo<input id="cpr" type="number" value="${c.price??''}"></label></div>
 <label>Trial ends<input id="ctr" type="date" value="${c.trial_ends||''}"></label><label>Notes<textarea id="cno" rows="2">${esc(c.notes||'')}</textarea></label><button class="btn" onclick="busy(this,()=>coSave('${c.id}'))">Save</button></div>
 <div class="card"><h2>Waiting to sign up (${coInv.length})</h2>${coInv.length?invRows(coInv):'<p class="sub">Nobody waiting. Everyone invited has signed up.</p>'}</div>
 <div class="card"><h2>Billing</h2><div class="note">💳 Stripe billing isn't connected yet. Once it is, this shows payments and turns access off automatically after a 7-day grace period.</div></div>
 <div class="card" style="padding:4px 16px">${nrow(`openBk('${c.id}')`,'🛟 Backup &amp; restore','Download, saved backups, restore')}</div><button class="btn sec" onclick="openCo('${c.id}')">Open company as Admin ›</button><button class="btn red" style="margin-top:10px" onclick="coDel('${c.id}')">Delete company and all its data</button>`}
async function coSave(id){await q(sb.from('companies').update({name:$('#cn').value.trim(),plan:$('#cpl').value,price:$('#cpr').value||null,trial_ends:$('#ctr').value||null,notes:$('#cno').value}).eq('id',id),'Saved');companies=await q(sb.from('companies').select('*').order('name'));render()}
async function coDel(id){const c=companies.find(x=>x.id===id);const t=prompt(`This permanently deletes ${c.name} and all its people, jobs, certs, photos and backups. Members' logins are kept but won't belong to any company.\n\nType the company name to confirm:`);if(t===null)return;if(t.trim()!==c.name)return alert('The name didn\u2019t match, so nothing was deleted.');
 const paths=await q(sb.rpc('delete_company',{cid:id,confirm_name:c.name}));for(let i=0;i<(paths||[]).length;i+=100)await sb.storage.from('cert-photos').remove(paths.slice(i,i+100));
 if(cid===id){cid=null;localStorage.removeItem('cc.app.ownerCid');D=null}toast(c.name+' deleted');companies=await q(sb.from('companies').select('*').order('name'));go('owner',null,true)}
function inviteCoView(){return `<button class="back" onclick="goBack('owner')">← Companies</button><h1>Invite a company</h1><div class="card"><label>Company name<input id="ncn" placeholder="e.g. Example Towers Inc."></label><label>Admin's name<input id="nan"></label><label>Admin's email<input id="nae" type="email"></label>
 <div class="row"><label>Pricing<select id="npl"><option value="per_company">Per company</option><option value="per_user">Per user</option></select></label><label>Price $/mo<input id="npr" type="number"></label></div><label>Free trial (days, optional)<input id="ntd" type="number" min="0" placeholder="e.g. 30"></label>
 <button class="btn" onclick="busy(this,inviteCo)">Create company &amp; invite admin</button><p class="sub">You'll get a sign-up link to send to their Admin. They then invite their own team.</p></div>`}
async function inviteCo(){const n=$('#ncn').value.trim(),e=$('#nae').value.trim().toLowerCase(),d=parseInt($('#ntd').value);if(!n)return toast('Enter a company name');if(!/^\S+@\S+\.\S+$/.test(e))return toast('Enter the admin\u2019s email');if(!await invOk(e,null))return;
 const te=d>0?new Date(Date.now()+d*864e5).toISOString().slice(0,10):null;const [c]=await q(sb.from('companies').insert({name:n,plan:$('#npl').value,price:$('#npr').value||null,trial_ends:te}).select());
 const [ni]=await q(sb.from('pending_invites').insert({email:e,company_id:c.id,role:'admin',name:$('#nan').value.trim()||null,invited_by:sess.user.id}).select());const m=await mailInvite(ni);companies=await q(sb.from('companies').select('*').order('name'));await loadCoInv(c.id);go('invready',{email:e,mail:m,back:"goBack('owner')"},true)}
boot();
</script></body></html>
